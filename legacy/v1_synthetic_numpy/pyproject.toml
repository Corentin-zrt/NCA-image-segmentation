[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nca-image-segmentation"
version = "0.1.0"
description = "Experiments for image segmentation with neural cellular automata"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pygame>=2.5",
    "Pillow>=10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
